services:
  backend:
    build:
      context: ./kindergarten-management-system-backend
    environment:
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      SQLITE_DB_PATH: /data/development.sqlite3
      JWT_SECRET: development-docker-jwt-secret
      ALLOWED_ORIGINS: http://localhost:4000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-v4-flash
    ports:
      - "3000:3000"
    volumes:
      - ./kindergarten-management-system-backend:/app
      - backend_bundle:/usr/local/bundle
      - backend_sqlite:/data
    command: >
      sh -c "rm -f tmp/pids/server.pid &&
             bundle exec rails db:prepare &&
             bundle exec rails server -b 0.0.0.0 -p 3000"

  frontend:
    build:
      context: ./kindergarten-management-system-frontend
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      REACT_APP_API_PROXY_TARGET: http://backend:3000
    ports:
      - "4000:4000"
    volumes:
      - ./kindergarten-management-system-frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  backend_bundle:
  backend_sqlite:
  frontend_node_modules:
